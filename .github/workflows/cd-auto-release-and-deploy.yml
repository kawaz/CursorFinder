name: CD - Auto Release and Deploy

# DR-0010: SPM 完結 + scripts/build-app-bundle.sh 経路。
# 旧 xcodeproj (xcodebuild archive) 段は廃止し、bottom-up codesign + notarytool + stapler
# パターンに書き換える (kawaz/authsock-warden 等での実績パターン、
# personal-macos-signing-notarization skill 準拠)。
#
# Cask 更新・タグ/リリース作成・secrets 参照の後段は温存。
# 変更検出 path filter は v3 の実体 (App/, Core/, Package.swift, resolved, calibration 資産, script) を追う。

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even without code changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check for code changes
        id: check_changes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          if [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "Force release requested"
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # DR-0010: v3 の path filter。App/Core/Package.swift/resolved/calibration 資産/
          # build-app-bundle.sh/Info.plist.template の変更でリリース。
          CODE_CHANGES=$(git diff --name-only "$LATEST_TAG"..HEAD | grep -E \
            '(^App/|^Core/|Package\.swift$|Package\.resolved$|Resources/calibration/|scripts/build-app-bundle\.sh$|scripts/Info\.plist\.template$)' || true)

          if [ -z "$CODE_CHANGES" ]; then
            echo "No code changes found since $LATEST_TAG"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Code changes found:"
            echo "$CODE_CHANGES"
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump
        if: steps.check_changes.outputs.skip_release != 'true'
        id: version_bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" --reverse)
          else
            COMMITS=$(git log "${LATEST_TAG}"..HEAD --pretty=format:"%s")
          fi

          BUMP_TYPE="patch"
          while IFS= read -r commit; do
            if [[ "$commit" =~ ^(feat|feature): ]] || [[ "$commit" =~ BREAKING[\ -]CHANGE ]]; then
              BUMP_TYPE="minor"
              break
            fi
          done <<< "$COMMITS"

          echo "Bump type: $BUMP_TYPE"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

          CURRENT_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if [ "$BUMP_TYPE" = "minor" ]; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "New version: v$NEW_VERSION"
          echo "new_version=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.check_changes.outputs.skip_release != 'true'
        run: |
          NEW_VERSION="${{ steps.version_bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_VERSION" -m "Auto-release $NEW_VERSION"
          echo "Created tag $NEW_VERSION"

      - name: Generate Release Notes
        if: steps.check_changes.outputs.skip_release != 'true'
        id: changelog
        run: |
          NEW_VERSION="${{ steps.version_bump.outputs.new_version }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$(git rev-list --tags --skip=1 --max-count=1)" 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" --reverse | grep -v "^- Update Cask to v" || true)
          else
            COMMITS=$(git log "${PREVIOUS_TAG}"..HEAD --pretty=format:"- %s" | grep -v "^- Update Cask to v" || true)
          fi

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "- Minor improvements and bug fixes"
            fi
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${NEW_VERSION}"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${NEW_VERSION}"
            fi
          } > release_notes.md

      - name: Set up Xcode
        if: steps.check_changes.outputs.skip_release != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up code signing
        if: steps.check_changes.outputs.skip_release != 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build .app bundle (SPM + build-app-bundle.sh)
        if: steps.check_changes.outputs.skip_release != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version_bump.outputs.version_number }}"
          echo "Building version $VERSION"

          # build-app-bundle.sh は:
          #   1. swift build -c release で laserguide-dev をビルド
          #   2. LaserGuide.app 構造を組み立て (Info.plist は template から生成)
          #   3. calibration リソースを Contents/Resources 直下へコピー
          #   4. codesign (identity 指定時は --options runtime --timestamp を明示)
          #   5. codesign --verify --deep --strict で検証
          scripts/build-app-bundle.sh --version "$VERSION" --identity "$APPLE_SIGNING_IDENTITY"

          # 検証: signature が Apple Developer ID かどうか確認 (旧 workflow と同じ ad-hoc 排除ロジック)
          APP_PATH="build/app/LaserGuide.app"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee /tmp/codesign_output.txt

          if grep -q "Signature=adhoc" /tmp/codesign_output.txt; then
            echo "Error: App is only adhoc signed"
            exit 1
          elif grep -q "Authority=Apple Development:" /tmp/codesign_output.txt \
              || grep -q "Authority=Developer ID Application:" /tmp/codesign_output.txt; then
            echo "App is properly code signed"
            grep "Authority=" /tmp/codesign_output.txt | head -1
            grep "TeamIdentifier=" /tmp/codesign_output.txt || true
          else
            echo "Unexpected signature status"
            cat /tmp/codesign_output.txt
            exit 1
          fi

      - name: Create ZIP
        if: steps.check_changes.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version_bump.outputs.version_number }}"
          ZIP_NAME="LaserGuide-${VERSION}.zip"

          # notarytool は zip を受け付ける。旧経路と同じ命名で Cask 更新の regex を維持する。
          cd build/app
          zip -r "../../${ZIP_NAME}" LaserGuide.app
          cd -

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

          if [ ! -f "${ZIP_NAME}" ]; then
            echo "Error: ZIP file was not created"
            exit 1
          fi
          echo "Created ${ZIP_NAME}"

      - name: Notarize App
        if: steps.check_changes.outputs.skip_release != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ZIP_NAME="${{ env.ZIP_NAME }}"

          xcrun notarytool submit "$ZIP_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 10m \
            2>&1 | tee /tmp/notarization_output.txt

          if grep -q "status: Accepted" /tmp/notarization_output.txt; then
            echo "Notarization succeeded"
          else
            echo "Notarization failed"
            cat /tmp/notarization_output.txt
            exit 1
          fi

      - name: Staple Notarization Ticket
        if: steps.check_changes.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          ZIP_NAME="${{ env.ZIP_NAME }}"

          # ZIP を一時展開して staple、その後 zip をやり直す (旧経路と同じ手順)。
          rm -rf /tmp/staple-work
          mkdir -p /tmp/staple-work
          unzip -q "$ZIP_NAME" -d /tmp/staple-work

          xcrun stapler staple /tmp/staple-work/LaserGuide.app
          xcrun stapler validate /tmp/staple-work/LaserGuide.app

          rm "$ZIP_NAME"
          ( cd /tmp/staple-work && zip -r "$OLDPWD/${ZIP_NAME}" LaserGuide.app )
          rm -rf /tmp/staple-work

          echo "Notarization ticket stapled and re-zipped"

      - name: Push tag
        if: steps.check_changes.outputs.skip_release != 'true'
        run: |
          NEW_VERSION="${{ steps.version_bump.outputs.new_version }}"
          git push origin "$NEW_VERSION"
          echo "Pushed tag $NEW_VERSION"

      - name: Create Release with Asset
        if: steps.check_changes.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_bump.outputs.new_version }}
          body_path: release_notes.md
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Update Homebrew Tap
        if: steps.check_changes.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version_bump.outputs.version_number }}"
          SHA256=$(shasum -a 256 "${ZIP_NAME}" | awk '{print $1}')

          echo "Version: $VERSION"
          echo "SHA256: $SHA256"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/kawaz/homebrew-laserguide.git" tap-repo
          cd tap-repo

          sed -i '' \
            -e "s|version \"[0-9.]*\"|version \"${VERSION}\"|" \
            -e "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA256}\"|" \
            Casks/laserguide.rb

          echo "Updated Cask contents:"
          cat Casks/laserguide.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/laserguide.rb
          git commit -m "Update Cask to v${VERSION}"
          git push origin main

          echo "Updated Homebrew tap to v${VERSION}"

      - name: Clean up keychain
        if: always() && steps.check_changes.outputs.skip_release != 'true'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
