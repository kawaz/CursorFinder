name: Code Quality

# DR-0010: SPM 完結構成 (App + Core パッケージ)。旧 xcodeproj 経路の
# analyze / ASAN ステップは廃止し、swift build + swift test + swiftlint --strict に統一。
# Address / Undefined Sanitizer は Package.swift 側での対応が別途必要になったら追加検討する
# (Phase 1 の main merge 時点では過剰、まずは lint + build + test の基本 gate を回す)。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift toolchain
        run: swift --version

      - name: SwiftLint (--strict)
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
          swiftlint --strict --reporter github-actions-logging

      - name: Build Core (release)
        run: |
          cd Core
          swift build -c release

      - name: Build App (release)
        run: |
          cd App
          swift build -c release

      - name: Test Core
        run: |
          cd Core
          swift test --parallel

      - name: Test App
        run: |
          cd App
          swift test --parallel
