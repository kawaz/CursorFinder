name: CI - Build and Test

# リリース経路 (scripts/build-app-bundle.sh) の統合テスト。
# unit test / lint は code-quality.yml が担うため、ここでは
# 「.app バンドルが組み立てられて署名検証を通る」ことと、CD が前提とする
# 構成ファイルの存在を検証する。

on:
  # 全ブランチの push で発火 (feature ブランチ単独 push でも CI が回るように、2026-07-13 裁定)。
  # pull_request は fork からの PR 用に残し、同一リポ PR での push との二重実行は job の if で抑止。
  push:
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    # push と pull_request の二重実行抑止: 同一リポからの PR は push 側だけで検証する
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check CI/CD pipeline components
        run: |
          echo "🔍 Checking CI/CD pipeline components..."
          test -f .github/workflows/cd-auto-release-and-deploy.yml || { echo "❌ CD workflow missing"; exit 1; }
          test -f .github/workflows/code-quality.yml || { echo "❌ Code quality workflow missing"; exit 1; }
          test -f Casks/laserguide.rb || { echo "❌ Cask file missing"; exit 1; }
          test -f justfile || { echo "❌ justfile missing"; exit 1; }
          test -x scripts/build-app-bundle.sh || { echo "❌ build-app-bundle.sh missing or not executable"; exit 1; }
          echo "🔍 Validating Cask syntax..."
          ruby -c Casks/laserguide.rb || { echo "❌ Cask syntax error"; exit 1; }
          echo "✅ All CI/CD components are present and valid"

      - name: Build .app bundle (ad-hoc) and verify
        run: |
          echo "🔨 Testing .app bundle assembly (release build + ad-hoc codesign)..."
          scripts/build-app-bundle.sh --version 0.0.0-ci
          test -d build/app/LaserGuide.app || { echo "❌ .app bundle missing"; exit 1; }
          codesign --verify --deep --strict build/app/LaserGuide.app
          plutil -lint build/app/LaserGuide.app/Contents/Info.plist
          echo "✅ Bundle assembly test completed successfully"

      - name: Test ZIP creation and checksum
        run: |
          echo "🎁 Testing ZIP creation (same shape as CD)..."
          ditto -c -k --keepParent build/app/LaserGuide.app LaserGuide-test.zip
          unzip -t LaserGuide-test.zip > /dev/null || { echo "❌ ZIP is corrupted"; exit 1; }
          SHA256=$(shasum -a 256 LaserGuide-test.zip | awk '{print $1}')
          [[ ${#SHA256} -eq 64 ]] || { echo "❌ Invalid SHA256 format"; exit 1; }
          echo "SHA256: $SHA256"
          echo "✅ ZIP creation test completed successfully"
