# SwiftLint Configuration for LaserGuide (SPM 構成)
#
# 対象は SPM 2 パッケージ (App/Sources, Core/Sources)。

included:
  - App/Sources
  - Core/Sources

excluded:
  - .build
  - build
  - .git
  - .github
  # scripts/ は one-shot 検証スクリプト群、リリース対象ではない
  - scripts

disabled_rules:
  - trailing_whitespace # コメント整形で残ることがある

opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - unused_private_declaration

analyzer_rules:
  - unused_import

line_length:
  warning: 140
  error: 160

# DR-0010 §6: 幾何ドメインの短識別子 (x/y/t/p/d/us/mm/to/wx/wy 等) を明示的に許容。
# LaserGuide の Core は幾何演算が主で、そこでの 1 文字は数式記号と同じ意味論を持つ
# (= 変数名の情報量は型と周辺コメントに載せる方針)。lint 対象外にする合理は
# ドメイン語彙由来であり、規約緩和ではなくドメイン特化。
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 40
    error: 50
  allowed_symbols: ["_"]

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20
